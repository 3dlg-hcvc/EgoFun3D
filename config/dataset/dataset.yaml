name: "CombinedDataset"
root_path: "./combined_dataset"
meta_file: "./combined_dataset/metadata.json"
image_type: "cropped"  # can be "undistorted" or "cropped"
sample_strategy: "fix_step"  # can be "fix_size" or "fix_step"
sample_num: 1  # number of sample when sample_strategy is "fix_size", number of sample interval when sample_strategy is "fix_step"

# Optional NewDataset annotations. Disabled fields are returned as null/None.
load_2d_masks: true
load_mesh_data: true
load_articulation: true
load_function_annotation: true
